<svg xmlns="http://www.w3.org/2000/svg" width="940" height="990" viewBox="0 0 940 990" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <style>
      .box { fill: #f3f6f9; stroke: #4a5568; stroke-width: 1.2; }
      .db  { fill: #eef2e6; stroke: #5b7a2a; stroke-width: 1.2; }
      .src { fill: #ffffff; stroke: #4a5568; stroke-width: 1.2; }
      .ttl { fill: #1d2129; font-weight: 700; }
      .edge { fill: none; stroke: #4a5568; stroke-width: 1.4; marker-end: url(#arrow); }
      .sep { stroke: #c5ccd6; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="940" height="990" fill="#ffffff"/>

  <!-- インデックス作成時 -->
  <text class="ttl" x="470" y="30" text-anchor="middle">インデックス作成時</text>

  <rect class="src" x="320" y="50" width="300" height="40" rx="6"/>
  <text class="ttl" x="470" y="75" text-anchor="middle">(1) チャンク(title + text)</text>

  <path class="edge" d="M470,90 V100 H230 V110"/>
  <path class="edge" d="M470,90 V100 H710 V110"/>

  <rect class="box" x="80" y="110" width="300" height="40" rx="6"/>
  <text class="ttl" x="230" y="135" text-anchor="middle">NFKC 正規化</text>

  <rect class="box" x="560" y="110" width="300" height="40" rx="6"/>
  <text class="ttl" x="710" y="135" text-anchor="middle">埋め込みモデルでベクトル化</text>

  <path class="edge" d="M230,150 V170 H100 V190"/>
  <path class="edge" d="M230,150 V190"/>
  <path class="edge" d="M230,150 V170 H360 V190"/>

  <rect class="box" x="40" y="190" width="120" height="40" rx="6"/>
  <text class="ttl" x="100" y="215" text-anchor="middle">(2) 形態素</text>
  <rect class="box" x="170" y="190" width="120" height="40" rx="6"/>
  <text class="ttl" x="230" y="215" text-anchor="middle">bi-gram</text>
  <rect class="box" x="300" y="190" width="120" height="40" rx="6"/>
  <text class="ttl" x="360" y="215" text-anchor="middle">1 文字</text>

  <path class="edge" d="M100,230 V250 H230 V270"/>
  <path class="edge" d="M230,230 V270"/>
  <path class="edge" d="M360,230 V250 H230 V270"/>

  <rect class="db" x="80" y="270" width="300" height="40" rx="6"/>
  <text class="ttl" x="230" y="295" text-anchor="middle">(3) 空白区切りの 3 つの列</text>

  <path class="edge" d="M230,310 V350"/>
  <path class="edge" d="M710,150 V350"/>

  <rect class="db" x="80" y="350" width="300" height="40" rx="6"/>
  <text class="ttl" x="230" y="375" text-anchor="middle">(4) LanceDB の FTS インデックス</text>

  <rect class="db" x="560" y="350" width="300" height="40" rx="6"/>
  <text class="ttl" x="710" y="375" text-anchor="middle">LanceDB のベクトルインデックス</text>

  <line class="sep" x1="40" y1="430" x2="900" y2="430"/>

  <!-- 検索時 -->
  <text class="ttl" x="470" y="465" text-anchor="middle">検索時</text>

  <rect class="src" x="320" y="485" width="300" height="40" rx="6"/>
  <text class="ttl" x="470" y="510" text-anchor="middle">質問文</text>

  <path class="edge" d="M470,525 V535 H230 V545"/>
  <path class="edge" d="M470,525 V535 H710 V545"/>

  <rect class="box" x="80" y="545" width="300" height="40" rx="6"/>
  <text class="ttl" x="230" y="570" text-anchor="middle">(6) 品詞でキーワードを抜き出す</text>

  <rect class="box" x="560" y="545" width="300" height="40" rx="6"/>
  <text class="ttl" x="710" y="570" text-anchor="middle">質問をベクトル化</text>

  <path class="edge" d="M230,585 V625"/>
  <rect class="box" x="80" y="625" width="300" height="40" rx="6"/>
  <text class="ttl" x="230" y="650" text-anchor="middle">文書と同じ区切り(形態素・bi-gram)</text>

  <path class="edge" d="M230,665 V705"/>
  <rect class="box" x="80" y="705" width="300" height="40" rx="6"/>
  <text class="ttl" x="230" y="730" text-anchor="middle">(8) 問い合わせ(OR + フレーズ)</text>

  <path class="edge" d="M230,745 V785"/>
  <path class="edge" d="M710,585 V785"/>

  <!-- インデックスから結果へ(両端を回す) -->
  <path class="edge" d="M80,370 H50 V805 H80"/>
  <path class="edge" d="M860,370 H890 V805 H860"/>

  <rect class="db" x="80" y="785" width="300" height="40" rx="6"/>
  <text class="ttl" x="230" y="810" text-anchor="middle">(9) 全文検索の結果(BM25)</text>

  <rect class="db" x="560" y="785" width="300" height="40" rx="6"/>
  <text class="ttl" x="710" y="810" text-anchor="middle">ベクトル検索の結果</text>

  <path class="edge" d="M230,825 V845 H470 V865"/>
  <path class="edge" d="M710,825 V845 H470 V865"/>

  <rect class="box" x="320" y="865" width="300" height="40" rx="6"/>
  <text class="ttl" x="470" y="890" text-anchor="middle">(10) RRF で混ぜる</text>

  <path class="edge" d="M470,905 V925"/>
  <rect class="src" x="320" y="925" width="300" height="40" rx="6"/>
  <text class="ttl" x="470" y="950" text-anchor="middle">LLM に渡すチャンク</text>
</svg>
