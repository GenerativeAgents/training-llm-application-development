[project]
name = "training-llm-application-development"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents-cli==0.3.0",
    "langchain==1.4.2",
    "langchain-community==0.4.2",
    "langchain-core==1.6.4",
    "langchain-experimental==0.4.2",
    "langchain-openai==1.6.4",
    "langgraph==1.2.12",
    "numpy==2.5.3",
    "openai==3.19.0",
    "python-dotenv==1.2.3",
    "streamlit-feedback==0.1.4",
    "streamlit==1.64.0",
    "langchain-mcp-adapters==0.3.2",
    "wandb==0.30.0",
    "weave==0.53.9",
    "boto3==1.43.100",
    "requests==2.34.2",
    "markitdown[pdf,pptx,xlsx]==0.1.8",
    "lancedb==0.39.0",
    "sudachipy==0.7.0",
    "sudachidict-core==20260723.1",
]

[dependency-groups]
dev = ["jupyter==1.1.1"]

[tool.uv]
# サプライチェーン攻撃対策: 公開から2週間未満のバージョンを解決対象から除外する。
# 相対指定のため、依存変更や uv lock --upgrade などで再解決したときに
# 「その時点の2週間前」を基準にする。ロックが最新なら再解決は走らない。
exclude-newer = "2 weeks"
# exclude-newer の相対指定に対応したバージョンを要求する
required-version = ">=0.11"
