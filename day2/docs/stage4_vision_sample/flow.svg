<svg xmlns="http://www.w3.org/2000/svg" width="940" height="730" viewBox="0 0 940 730" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/>
    </marker>
    <style>
      .box { fill: #f3f6f9; stroke: #4a5568; stroke-width: 1.2; }
      .llm { fill: #dcecf2; stroke: #0b6e8f; stroke-width: 1.5; }
      .db  { fill: #eef2e6; stroke: #5b7a2a; stroke-width: 1.2; }
      .src { fill: #ffffff; stroke: #4a5568; stroke-width: 1.2; }
      .ttl { fill: #1d2129; font-weight: 700; }
      .edge { fill: none; stroke: #4a5568; stroke-width: 1.4; marker-end: url(#arrow); }
      .edge-dim { fill: none; stroke: #8a94a3; stroke-width: 1.3; stroke-dasharray: 5 4; marker-end: url(#arrow-dim); }
    </style>
  </defs>
  <rect width="940" height="730" fill="#ffffff"/>

  <!-- 元 -->
  <rect class="src" x="370" y="16" width="200" height="40" rx="6"/>
  <text class="ttl" x="470" y="41" text-anchor="middle">xlsx の 1 シート</text>

  <!-- 元 → (1)(3)(2) -->
  <path class="edge" d="M470,56 V76 H160 V96"/>
  <path class="edge" d="M470,56 V96"/>
  <path class="edge" d="M470,56 V76 H780 V96"/>

  <!-- (1) -->
  <rect class="box" x="20" y="96" width="280" height="44" rx="6"/>
  <text class="ttl" x="160" y="123" text-anchor="middle">(1) セルの文字 + 図形テキスト</text>

  <!-- (3) -->
  <rect class="box" x="320" y="96" width="300" height="44" rx="6"/>
  <text class="ttl" x="470" y="123" text-anchor="middle">(3) XML から矢印の向きを確定</text>

  <!-- (2) -->
  <rect class="box" x="640" y="96" width="280" height="44" rx="6"/>
  <text class="ttl" x="780" y="123" text-anchor="middle">(2) シートを PNG に描く</text>

  <!-- (3) → (4) -->
  <path class="edge" d="M470,140 V190"/>

  <!-- (4) -->
  <rect class="box" x="320" y="190" width="300" height="44" rx="6"/>
  <text class="ttl" x="470" y="217" text-anchor="middle">(4) プロンプト(規則 + 矢印の一覧)</text>

  <!-- (4) → LLM, (2) → LLM -->
  <path class="edge" d="M470,234 V284"/>
  <path class="edge" d="M780,140 V306 H620"/>

  <!-- LLM -->
  <rect class="llm" x="320" y="284" width="300" height="44" rx="6"/>
  <text class="ttl" x="470" y="311" text-anchor="middle">マルチモーダル LLM</text>

  <!-- LLM → (5) -->
  <path class="edge" d="M470,328 V378"/>

  <!-- (5) -->
  <rect class="box" x="320" y="378" width="300" height="44" rx="6"/>
  <text class="ttl" x="470" y="405" text-anchor="middle">(5) LLM の出力(Figure の JSON)</text>

  <!-- (5) → (6), (3) → (6) -->
  <path class="edge" d="M470,422 V472"/>
  <path class="edge-dim" d="M320,118 H304 V494 H320"/>

  <!-- (6) -->
  <rect class="box" x="320" y="472" width="300" height="44" rx="6"/>
  <text class="ttl" x="470" y="499" text-anchor="middle">(6)「図の説明:」の行に組み立てる</text>

  <!-- (1) → (7), (6) → (7) -->
  <path class="edge" d="M160,140 V588 H320"/>
  <path class="edge" d="M470,516 V566"/>

  <!-- (7) -->
  <rect class="box" x="320" y="566" width="300" height="44" rx="6"/>
  <text class="ttl" x="470" y="593" text-anchor="middle">(7) チャンクに切り ID を付ける</text>

  <!-- (7) → DB -->
  <path class="edge" d="M470,610 V660"/>

  <!-- DB -->
  <rect class="db" x="320" y="660" width="300" height="44" rx="6"/>
  <text class="ttl" x="470" y="687" text-anchor="middle">LanceDB(docs_vision テーブル)</text>
</svg>
